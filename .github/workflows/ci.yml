name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Tests that call a real model are gated behind OCTET_LIVE=1 and the browser smoke test behind
# OCTET_BROWSER=1. Neither variable is set here, so CI never spends tokens or needs Chrome.

jobs:
  test:
    name: check, typecheck, test, build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Source hygiene
        run: pnpm check
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and integration tests
        run: pnpm test
      - name: Build the UI
        run: pnpm ui:build

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    # Needs the network and the registry's audit endpoint; an outage there must not block a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
